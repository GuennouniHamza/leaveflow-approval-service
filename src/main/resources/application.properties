
server.port=8083
spring.application.name=approval-service

spring.datasource.url=jdbc:postgresql://localhost:5432/leaveflow_approval
spring.datasource.username=leaveflow
spring.datasource.password=leaveflow

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=approval-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# URL d'employee-service, pour l'appel Feign
employee-service.url=http://localhost:8081
