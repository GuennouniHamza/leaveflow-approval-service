
server.port=8083
spring.application.name=approval-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leaveflow_approval}
spring.datasource.username=${DB_USER:leaveflow}
spring.datasource.password=${DB_PASSWORD:leaveflow}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=approval-service-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# URL d'employee-service, pour l'appel Feign
employee-service.url=http://localhost:8081
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/leaveflow}